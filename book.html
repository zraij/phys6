<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>فيزياء السادس العلمي</title></head>
<body style="margin:0;background:#0E1020">
<script>
(function () {
  var h = null; try { h = window.parent !== window && window.parent.__BOOK; } catch (_) {}
  if (!h) { location.replace('./'); return; }
  // بعد ما تخلص قراءة هذي الصفحة نبدّلها بالكتاب (نفس الرابط، فالصور والملفات والحفظ تشتغل عادي)
  document.addEventListener('DOMContentLoaded', function () { setTimeout(function () { document.open(); document.write(h); document.close(); }, 0); });
})();
</script>
</body></html>
